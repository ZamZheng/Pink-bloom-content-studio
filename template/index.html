<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080, initial-scale=1">
  <title>Pink Bloom · 动态编辑布局预览</title>
  <link rel="stylesheet" href="../node_modules/@fontsource/noto-serif-sc/600.css">
  <link rel="stylesheet" href="../node_modules/@fontsource/noto-sans-sc/400.css">
  <link rel="stylesheet" href="../node_modules/@fontsource/noto-sans-sc/600.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <article id="card" aria-label="康复知识卡片">
    <img id="background" class="background" alt="" hidden>
    <div class="surface" data-layout="editorial-flow">
      <header data-region="栏目信息" data-block>
        <div class="masthead">
          <div class="column-group"><span class="icon" aria-hidden="true"></span><span id="column" data-region="栏目"></span></div>
          <span id="issue" data-region="期数"></span>
        </div>
        <p id="review-status" data-region="审核状态"></p>
      </header>
      <h1 id="title" data-region="主标题" data-block></h1>
      <div class="editorial-body">
      <p id="introduction" data-region="引导语" data-block></p>
      <ol id="points" data-region="知识点列表"></ol>
      <aside id="reminder-box" data-region="提醒区域" data-block>
        <p class="reminder-label">提醒</p>
        <p id="reminder" data-region="医学提醒"></p>
      </aside>
      </div>
      <footer data-region="落款" data-block>
        <p id="brand-cn" data-region="中文落款"></p>
        <p id="brand-en" data-region="英文落款"></p>
      </footer>
    </div>
  </article>
</body>
</html>
